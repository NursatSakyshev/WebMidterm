services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-library_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-library_pass}
      POSTGRES_DB: ${DB_NAME:-library}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - library-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Library API}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-library_user}
      DB_PASSWORD: ${DB_PASSWORD:-library_pass}
      DB_NAME: ${DB_NAME:-library}
    ports:
      - "${APP_PORT:-8080}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - library-network

volumes:
  db-data:

networks:
  library-network:
    driver: bridge
